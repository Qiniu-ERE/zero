<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="860" viewBox="0 0 1400 860" font-family="PingFang SC, Noto Sans SC, sans-serif">
  <rect width="1400" height="860" fill="#eef1f5"/>
  <text x="700" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#16181d">树莓派 · 插电即玩的“FC 游戏机”（概念示意）</text>
  <!-- 电视 16:9 -->
  <rect x="300" y="80" width="800" height="470" rx="18" fill="#16181d"/>
  <rect x="316" y="96" width="768" height="432" fill="#000"/>
  <image xlink:href="../screens/desktop-launcher-play.png" x="412" y="96" width="576" height="432"/>
  <rect x="660" y="550" width="80" height="40" fill="#2a2d35"/><rect x="560" y="590" width="280" height="14" rx="7" fill="#2a2d35"/>
  <text x="1110" y="300" font-size="18" fill="#3a4250">HDMI 电视 / 显示器</text>
  <text x="1110" y="326" font-size="18" fill="#3a4250">4:3 画面居中，两侧留黑</text>
  <!-- 树莓派 -->
  <g transform="translate(250 660)">
    <rect width="230" height="150" rx="14" fill="#2e8b57"/>
    <rect x="18" y="20" width="70" height="70" rx="6" fill="#c9cdd4"/>
    <rect x="110" y="24" width="90" height="12" fill="#e2b33a"/><rect x="110" y="44" width="90" height="12" fill="#e2b33a"/>
    <rect x="200" y="96" width="40" height="40" rx="4" fill="#9aa1ad"/>
    <text x="115" y="128" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Raspberry Pi 5</text>
  </g>
  <path d="M480 720 C 560 720, 560 600, 660 600" fill="none" stroke="#2a2d35" stroke-width="6"/>
  <text x="500" y="690" font-size="16" fill="#3a4250">HDMI</text>
  <!-- FC 手柄 -->
  <g transform="translate(860 670)">
    <rect width="300" height="120" rx="24" fill="#c8c3b8"/>
    <rect x="16" y="16" width="268" height="88" rx="14" fill="#2a2a2a"/>
    <rect x="52" y="44" width="16" height="48" fill="#888"/><rect x="36" y="60" width="48" height="16" fill="#888"/>
    <rect x="118" y="64" width="26" height="9" rx="4" fill="#666"/><rect x="152" y="64" width="26" height="9" rx="4" fill="#666"/>
    <circle cx="214" cy="68" r="15" fill="#c8322a"/><circle cx="254" cy="68" r="15" fill="#c8322a"/>
    <text x="150" y="146" text-anchor="middle" font-size="18" fill="#3a4250">USB FC / 8BitDo 手柄</text>
  </g>
  <path d="M860 720 C 700 760, 560 760, 480 760" fill="none" stroke="#2a2d35" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="640" y="790" font-size="16" fill="#3a4250">USB（手柄→键盘映射）</text>
  <g font-size="17" fill="#3a4250">
    <text x="40" y="150" font-weight="700" fill="#16181d">开机流程</text>
    <text x="40" y="180">① 上电，Pi OS Lite 自动登录</text>
    <text x="40" y="206">② cage / kiosk 全屏启动</text>
    <text x="40" y="232">　 TankBattle 可执行文件</text>
    <text x="40" y="258">③ 手柄方向键 = 方向键</text>
    <text x="40" y="284">　 A = J 开火 · START = Enter</text>
    <text x="40" y="310">　 SELECT = T 切换画风</text>
  </g>
  <text x="700" y="845" text-anchor="middle" font-size="18" fill="#3a4250">屏幕内为桌面启动器（spx buildlauncher）在 macOS 上的真实运行画面；树莓派版需自编 linux-arm64 runtime，见文档</text>
</svg>
