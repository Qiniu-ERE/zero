# 打包坦克大战：Windows / macOS / Linux 单文件程序、网页版（PWA，iPhone 和安卓用）、Android APK、iOS IPA，
# 需要时补到已有的 GitHub Release 里，或者新建 Release。
#
# 只能手动运行（Actions 页面 → Release → Run workflow）。2026-10-25 起平时在本机打包发布
# （tools/export/build_local.sh + release_local.sh，组织的 Actions 额度用完了）；这个工作流用来补本机打不了的平台
# （Windows、iOS），或者额度恢复后在云端打全部平台。打包脚本都在 tools/export/，和本机用的是同一套命令。
#
# 输入：
#   platforms       要打的平台，逗号分隔：windows macos linux web android ios；desktop = 三个桌面平台；all = 全部（默认）。
#                   再加 smoke：对这次打了的桌面平台跑冒烟测试（启动游戏并截图）；all 包含 smoke
#   upload_to       已有 Release 的标签（例如 v4.0.1）：检出这个标签的代码打包，打好后用 release_local.sh --append
#                   补进这个 Release（只上传 Release 里还没有的文件，重算 SHA256SUMS.txt，重新生成说明）。
#                   打包用标签上的代码；上传用这次运行所在分支（一般是 main）上的 release_local.sh 和 CHANGELOG.md
#   create_release  在标签上运行时（Use workflow from 选那个标签）新建 Release；默认不勾
# 不填 upload_to、也不勾 create_release 时只打包不发布，产物在这次运行的 Artifacts 里。
# 发布说明和本机发布用同一个脚本 tools/export/release_local.sh（缺的平台指向以前的版本）。
#
# APK 没法在 CI 的 x86_64 安卓模拟器里测：Godot 的安卓模板只有 ARM 引擎库，而模拟器的 ARM 转译不支持 Go 运行时读取 CPU 型号的指令。
#
# 第三方 Action 都锁定到提交（后面注释是对应的版本），升级时一起改。
name: Release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: '要打的平台：all，或者逗号分隔的 windows,macos,linux,web,android,ios,desktop,smoke'
        type: string
        default: all
      upload_to:
        description: '补到已有的 Release（标签，例如 v4.0.1）；空着不上传'
        type: string
        default: ''
      create_release:
        description: '在标签上运行时新建 Release（默认只打包不发布）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.upload_to }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.5'   # 和 tools/export/env.sh、spx 的 runtime.lock.json 一致（tests/tools 有测试核对）
  XGO_VERSION: 'v1.7.5'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      ref: ${{ steps.p.outputs.ref }}
      release: ${{ steps.p.outputs.release }}
      desktop: ${{ steps.p.outputs.desktop }}
      desktop_matrix: ${{ steps.p.outputs.desktop_matrix }}
      web: ${{ steps.p.outputs.web }}
      android: ${{ steps.p.outputs.android }}
      ios: ${{ steps.p.outputs.ios }}
      smoke_linux: ${{ steps.p.outputs.smoke_linux }}
      smoke_windows: ${{ steps.p.outputs.smoke_windows }}
      smoke_macos: ${{ steps.p.outputs.smoke_macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - id: p
        env:
          PLATFORMS: ${{ inputs.platforms }}
          UPLOAD_TO: ${{ inputs.upload_to }}
          CREATE: ${{ inputs.create_release }}
        run: |
          set -euo pipefail
          # 版本号和发布方式
          if [ -n "$UPLOAD_TO" ]; then
            case "$UPLOAD_TO" in v[0-9]*) ;; *) echo "::error::upload_to 要填标签，例如 v4.0.1"; exit 1 ;; esac
            [ "$CREATE" != true ] || { echo "::error::upload_to 和 create_release 只能选一个"; exit 1; }
            version="${UPLOAD_TO#v}"; ref="refs/tags/$UPLOAD_TO"; release=append
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"; ref="$GITHUB_REF"; release=none
            [ "$CREATE" != true ] || release=create
          else
            [ "$CREATE" != true ] || { echo "::error::create_release 要在标签上运行（Use workflow from 选标签）"; exit 1; }
            # 开发版：CHANGELOG.md 里最新的版本号（和本机打包一样由 env.sh 解析）+ -dev.运行编号
            base="$(bash -c 'source tools/export/env.sh >/dev/null 2>&1; printf %s "$APP_VERSION"')"
            [ -n "$base" ] || { echo "::error::CHANGELOG.md 里找不到版本号"; exit 1; }
            version="$base-dev.${GITHUB_RUN_NUMBER}"; ref="$GITHUB_REF"; release=none
          fi
          # 平台
          list="$(printf %s "${PLATFORMS:-all}" | tr -d ' ')"
          for t in ${list//,/ }; do
            case "$t" in all|desktop|windows|macos|linux|web|android|ios|smoke) ;; *) echo "::error::不认识的平台：$t"; exit 1 ;; esac
          done
          has() { [[ ",$list," == *",all,"* || ",$list," == *",$1,"* ]]; }
          matrix=""
          for pair in windows:windows-latest macos:macos-15 linux:ubuntu-latest; do
            name="${pair%%:*}"; os="${pair#*:}"
            if has "$name" || has desktop; then
              matrix="${matrix:+$matrix,}{\"os\":\"$os\"}"
              selected="true"
            else
              selected="false"
            fi
            if has smoke && [ "$selected" = true ]; then echo "smoke_$name=true"; else echo "smoke_$name=false"; fi >> "$GITHUB_OUTPUT"
          done
          if [ -n "$matrix" ]; then echo "desktop=true"; else echo "desktop=false"; fi >> "$GITHUB_OUTPUT"
          {
            echo "version=$version"
            echo "ref=$ref"
            echo "release=$release"
            # 一个桌面平台都不打时 desktop=false、任务跳过；矩阵里随便放一项，免得 fromJSON 拿到空的 include
            [ -n "$matrix" ] || matrix='{"os":"ubuntu-latest"}'
            echo "desktop_matrix={\"include\":[$matrix]}"
            for t in web android ios; do if has "$t"; then echo "$t=true"; else echo "$t=false"; fi; done
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  desktop:
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.desktop_matrix) }}   # macos-15（Apple 芯片）/ windows-latest（x64）/ ubuntu-latest（x64）
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - name: Set up MSYS2 (Windows：编译需要 gcc)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-toolchain
      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "${RUNNER_TEMP}/msys64/mingw64/bin" >> "$GITHUB_PATH"
      - name: Linux 依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev zip
      - uses: goplus/setup-xgo@97d9d9a23181e30248438a381e2669cd25de1427  # v1.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          xgo-version: ${{ env.XGO_VERSION }}
      - name: Go 放到普通目录（Windows）
        # buildlauncher 要求 go.exe 是“规范路径”，而 Go 在 Windows 上解析 C:\hostedtoolcache 的目录链接会失败
        if: runner.os == 'Windows'
        run: |
          cp -r "$(go env GOROOT)" "$RUNNER_TEMP/go"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: 安装 spx
        run: tools/export/setup_spx.sh
      - name: 打包
        run: tools/export/build.sh desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev zip
      - uses: goplus/setup-xgo@97d9d9a23181e30248438a381e2669cd25de1427  # v1.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          xgo-version: ${{ env.XGO_VERSION }}
      - run: tools/export/setup_spx.sh web
      - run: tools/export/build.sh web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: web
          path: dist/*
          if-no-files-found: error

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev zip
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Android NDK r23c（spx 锁定的版本）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;23.2.8568313" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/23.2.8568313" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: goplus/setup-xgo@97d9d9a23181e30248438a381e2669cd25de1427  # v1.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          xgo-version: ${{ env.XGO_VERSION }}
      - run: tools/export/setup_spx.sh android
      - name: 打包
        env:
          # 调试证书：仓库设置了这几个 Secret 就用固定的证书（新版本可以覆盖安装），否则 build.sh 临时生成一个。
          # 要和本机发布的 APK 用同一个证书，把本机的 ~/.config/tankbattle/debug.keystore 用 base64 存进 ANDROID_KEYSTORE_BASE64
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/debug.keystore"
            export GODOT_ANDROID_KEYSTORE_DEBUG_USER="$ANDROID_KEYSTORE_USER"
            export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::没有设置 ANDROID_KEYSTORE_BASE64：这次的 APK 用临时证书签名，装过别的版本的玩家要先卸载"
          fi
          tools/export/build.sh android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: macos-15
    env:
      APP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: goplus/setup-xgo@97d9d9a23181e30248438a381e2669cd25de1427  # v1.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          xgo-version: ${{ env.XGO_VERSION }}
      - run: tools/export/setup_spx.sh ios
      - run: tools/export/build.sh ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  # 冒烟测试：Linux 版在虚拟显示器 + 软件 Vulkan（lavapipe）里启动并截图
  smoke-linux:
    needs: [plan, desktop]
    if: needs.plan.outputs.smoke_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: desktop-Linux
          path: pkg
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-vulkan-drivers libgl1-mesa-dri imagemagick libasound2t64 || sudo apt-get install -y -q xvfb mesa-vulkan-drivers libgl1-mesa-dri imagemagick
      - name: 启动并截图
        run: |
          cd pkg && tar -xzf *.tar.gz
          Xvfb :99 -screen 0 1280x960x24 &
          export DISPLAY=:99
          sleep 2
          (./TankBattle > run.log 2>&1 &)
          sleep 40
          import -window root ../smoke-linux.png
          cp run.log ../smoke-linux.log
          pgrep -f gdspxrt > /dev/null || { echo "::error::游戏没有在运行"; tail -50 run.log; exit 1; }
          echo "running"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: smoke-linux
          path: |
            smoke-linux.png
            smoke-linux.log

  # 冒烟测试：Windows 版启动后截屏（没有显卡时 Godot 会用 D3D12 的软件渲染）
  smoke-windows:
    needs: [plan, desktop]
    if: needs.plan.outputs.smoke_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: desktop-Windows
          path: pkg
      - name: 启动并截图
        shell: pwsh
        run: |
          Get-ChildItem pkg -Filter *.zip | Expand-Archive -DestinationPath game
          Start-Process -FilePath game\TankBattle.exe -WorkingDirectory game
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\smoke-windows.png")
          $p = Get-Process | Where-Object { $_.Name -like 'gdspx*' }
          $p | Format-Table Name, Id, WS -AutoSize
          if (-not $p) { Write-Error "游戏没有在运行"; exit 1 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: smoke-windows
          path: smoke-windows.png

  # 冒烟测试：macOS 版启动后截屏
  smoke-macos:
    needs: [plan, desktop]
    if: needs.plan.outputs.smoke_macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: desktop-macOS
          path: pkg
      - name: 启动并截图
        run: |
          ditto -x -k pkg/*.zip game
          app=$(find game -maxdepth 1 -name '*.app' | head -1)
          ("$app/Contents/MacOS/TankBattle" > run.log 2>&1 &)
          sleep 45
          screencapture -x smoke-macos.png || true
          cp run.log smoke-macos.log
          pgrep -fl gdspxrt || { echo "::error::游戏没有在运行"; tail -50 run.log; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: smoke-macos
          path: |
            smoke-macos.png
            smoke-macos.log

  # 发布：只有填了 upload_to（补到已有的 Release）或者在标签上勾了 create_release 才运行。
  # 只选了一部分平台时，其余任务是 skipped，这里不当成失败；任何一个任务失败或取消就不发布
  release:
    needs: [plan, desktop, web, android, ios, smoke-linux, smoke-windows, smoke-macos]
    if: >-
      !cancelled() && needs.plan.outputs.release != 'none'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      # 用这次运行所在分支（一般是 main）的 release_local.sh，不用标签上的：旧标签上的脚本还没有 --append
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # release_local.sh 要核对标签
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: 发布（tools/export/release_local.sh，和本机发布同一个脚本）
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.plan.outputs.version }}
          MODE: ${{ needs.plan.outputs.release }}
          SKIP_BUILD_CHECK: '1'   # 包是在这个标签的代码上打的，没有本机打包的 dist/BUILD_LOCAL.md
        run: |
          ls -la dist
          # release_local.sh 只认 TankBattle-<版本>-<平台> 这几种文件，冒烟测试的截图和日志不会被上传
          if [ "$MODE" = append ]; then
            tools/export/release_local.sh --append
          else
            tools/export/release_local.sh
          fi
