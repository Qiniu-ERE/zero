# 轻量检查（只用 Ubuntu，一两分钟；现在只能手动运行，见下面的 on:）：
# - 8 张关卡地图合法（tools/levels/check.py）
# - 生成的美术和界面（tools/assets/build.py）和提交的一致：改了文案或生成器却忘了重新生成，这里会报错
# - TankBattle.xbp 的内容和 TankBattle/ 一致：改了游戏却忘了重新打包 .xbp，这里会报错
name: Check

on:
  # 2026-10-25 起 PR 的检查改在本地做：tools/test/pr_check.sh（和这里相同的三项检查 + 全部测试），报告贴在 PR 里。
  # 组织的 Actions 额度用完，自动触发只会显示失败，所以只保留手动运行。
  # 第三方 Action 都锁定到提交（后面注释是对应的版本）。
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: 关卡地图
        run: python3 tools/levels/check.py
      - name: 生成的素材是最新的
        run: |
          pip install -q -r tools/assets/requirements.txt
          python3 tools/assets/build.py
          if ! git diff --quiet || [ -n "$(git status --porcelain TankBattle tools)" ]; then
            echo "::error::生成的素材和提交的不一致：改了 strings.py / build.py 后请运行 python3 tools/assets/build.py 并提交生成的文件"
            git status --short TankBattle tools | head -30
            exit 1
          fi
      - name: TankBattle.xbp 是最新的
        run: |
          mkdir -p /tmp/xbp && cd /tmp/xbp && unzip -q "$GITHUB_WORKSPACE/TankBattle.xbp"
          if ! diff -rq /tmp/xbp "$GITHUB_WORKSPACE/TankBattle" -x .temp; then
            echo "::error::TankBattle.xbp 和 TankBattle/ 不一致：请运行 ./tools/package_xbp.sh 并提交"
            exit 1
          fi
