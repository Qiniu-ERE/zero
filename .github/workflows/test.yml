# 自动化测试（见 docs/v4/TEST_PLAN.md 第五节）
#
# - 每个 PR、推送到 main / v4.0：跑构建工具测试和引擎内测试
# - 推送到 test/** ci/** 分支时，只在提交信息里带 [ci test] 才跑（调试用，节省 Actions 分钟数）
# - 结果写在这次运行的 Summary 里；引擎内测试失败时，每组的日志作为 Artifacts 上传
#
# 打包和多平台冒烟测试在 release.yml。
name: Test

on:
  pull_request:
  push:
    branches: [main, v4.0, 'test/**', 'ci/**']

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.5'   # 和 release.yml、spx 的 runtime.lock.json 一致
  XGO_VERSION: 'v1.7.5'
  PYTHONUTF8: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.p.outputs.run }}
    steps:
      - id: p
        env:
          MSG: ${{ github.event.head_commit.message }}
          REF: ${{ github.ref_name }}
        run: |
          run=true
          if [ "${{ github.event_name }}" = push ]; then
            case "$REF" in
              test/*|ci/*) [[ "$MSG" == *"[ci test]"* ]] || run=false ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  tools:
    name: 构建工具测试
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/assets/requirements.txt
      - run: pip install -r tools/assets/requirements.txt
      - name: 字体缓存
        uses: actions/cache@v4
        with:
          path: tools/assets/.cache
          key: font-${{ hashFiles('tools/assets/textpath.py') }}
      - name: 测试
        run: |
          set -o pipefail
          python -m unittest discover -s tests/tools -v 2>&1 | tee tools.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### 构建工具测试"
            echo '```'
            tail -5 tools.log 2>/dev/null || echo "没有输出"
            grep -E '^(FAIL|ERROR):' tools.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  spx:
    name: 引擎内测试
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux 依赖
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev xorg-dev libasound2-dev libopenal-dev
      - uses: goplus/setup-xgo@v1
        with:
          go-version: ${{ env.GO_VERSION }}
          xgo-version: ${{ env.XGO_VERSION }}
      - name: spx 缓存
        uses: actions/cache@v4
        with:
          path: |
            .build/cache/spx
            ~/go/bin
          key: spx-${{ runner.os }}-${{ hashFiles('tools/export/env.sh', 'tools/export/setup_spx.sh', 'tools/export/patch_spx.py') }}
      - name: 安装 spx
        run: tools/export/setup_spx.sh
      - name: 测试
        run: |
          set -o pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          TMPDIR="$RUNNER_TEMP" tools/test/run_spx.sh 2>&1 | tee spx.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### 引擎内测试"
            echo '```'
            cat spx.log 2>/dev/null || echo "没有输出"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spx-test-logs
          path: ${{ runner.temp }}/tankbattle-test/*/run.log
